name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions match
        run: |
          MANIFEST=$(jq -r .version src/manifest.json)
          PACKAGE=$(jq -r .version package.json)
          if [[ "$MANIFEST" != "$PACKAGE" ]]; then
            echo "::error::src/manifest.json is $MANIFEST but package.json is $PACKAGE"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm lint
