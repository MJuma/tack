<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>New Tab</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f9f9fb,#2b2a33);--fg:light-dark(#15141a,#fbfbfe);--muted:light-dark(#6f6f7a,#b4b4bf);--box:light-dark(#fff,#42414d);font:13px/1.35 -apple-system,system-ui,sans-serif}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
#g{box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fill,160px);grid-auto-rows:160px;justify-content:center;gap:12px;max-width:1068px;margin:0 auto;padding:max(40px,10vh) 24px 64px}
.t{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:22px 10px 12px;border-radius:18px;background:var(--box);box-shadow:0 0 0 1px light-dark(#0000001a,#ffffff12),0 2px 0 light-dark(#00000012,#00000052);transition:translate .1s,box-shadow .1s}
.t:hover,.t:has(:focus-visible){translate:0 -2px;box-shadow:0 0 0 1px light-dark(#0000002e,#ffffff24),0 8px 20px light-dark(#00000014,#00000059)}
.t:has(.m:focus-visible){outline:2px solid AccentColor;outline-offset:2px}
.m{display:flex;flex-direction:column;align-items:center;gap:9px;max-width:100%;color:inherit;text-decoration:none;outline:none}
.m::after{content:"";position:absolute;inset:0;border-radius:inherit}
.i{width:44px;height:44px;border-radius:10px}
.l{display:grid;place-items:center;background:hsl(var(--h) 45% 48%);color:#fff;font-weight:650}
.m .l{font-size:20px}
@media (prefers-color-scheme:dark){.dark-icon{filter:invert(1)}}
@media (prefers-color-scheme:light){.light-icon{filter:invert(1)}}
.n{max-width:100%;overflow:hidden;font-size:14px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.u{max-width:100%;margin-top:3px;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.subs{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:100%;margin-top:7px}
.s{position:relative;color:inherit;text-decoration:none;outline:none}
.s:focus-visible{box-shadow:0 0 0 2px AccentColor}
.list .s{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:21px;box-sizing:border-box;padding:0 9px;border-radius:999px;background:light-dark(#0000000a,#ffffff12);color:var(--muted);font-size:11.5px;font-weight:500;white-space:nowrap}
.two .s{max-width:calc(50% - 2px);padding:0 7px;font-size:11px}
.two .s img{display:none}
.list .s span{overflow:hidden;text-overflow:ellipsis}
.list .s img{flex:none;width:14px;height:14px}
.list .s:hover{background:light-dark(#00000017,#ffffff24);color:var(--fg)}
.row{margin-top:9px}
.row .s{display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.row .s img{width:18px;height:18px}
.row .s .l{width:18px;height:18px;border-radius:5px;font-size:10px}
.row .s:hover{background:light-dark(#00000014,#ffffff24);scale:1.15}
.empty{grid-column:1/-1;justify-self:center;padding:12px 18px;border:1px dashed light-dark(#0000004d,#ffffff4d);border-radius:12px;background:none;color:inherit;font:inherit;cursor:pointer}
#e{position:fixed;right:12px;bottom:12px;padding:6px 9px;border:0;border-radius:8px;background:none;color:inherit;font:16px/1 system-ui;opacity:.3;cursor:pointer}
#e:hover,#e:focus-visible{opacity:1;background:light-dark(#0000000d,#ffffff14)}
</style>
</head>
<body>
<main id="g"></main>
<button id="e" type="button" title="Edit links" aria-label="Edit links">✎</button>
<script src="newtab.js"></script>
</body>
</html>
